<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JioTV Live IPTV Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            max-width: 480px;
            margin: 0 auto;
            padding: 12px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .youtube-icon {
            background-color: #ff0000;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }
        .app-title {
            font-size: 18px;
            font-weight: bold;
        }
        .icons {
            display: flex;
            gap: 8px;
        }
        .icon-btn {
            background: #2a2a2a;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .player-container {
            width: 100%;
            height: 220px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .current-show {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .show-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .show-time {
            font-size: 12px;
            color: #aaa;
        }
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .filter-btn {
            background: #2a2a2a;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #5a3d40;
        }
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 350px;
            overflow-y: auto;
        }
        .channel-item {
            display: flex;
            align-items: center;
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            gap: 12px;
            transition: background 0.2s;
        }
        .channel-item:hover {
            background: #2a2a2a;
        }
        .channel-logo {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            background: #333;
        }
        .channel-info {
            flex-grow: 1;
        }
        .channel-name {
            font-size: 14px;
            font-weight: bold;
        }
        .channel-playing {
            font-size: 11px;
            color: #888;
        }
        .footer {
            text-align: center;
            font-size: 10px;
            color: #666;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <span class="youtube-icon">▶</span>
            <span class="app-title">JioTV</span>
        </div>
        <div class="icons">
            <button class="icon-btn">🔍</button>
            <button class="icon-btn">👤</button>
        </div>
    </div>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="current-show">
        <div class="show-title" id="currentShowTitle">சேனலைத் தேர்ந்தெடுக்கவும்</div>
        <div class="show-time" id="currentShowTime">IPTV Live Stream Player</div>
    </div>

    <div class="filters">
        <button class="filter-btn active">📅 Today Live</button>
        <button class="filter-btn">⚙️ All Channels</button>
        <button class="filter-btn">⭐ Favorites</button>
    </div>

    <div class="channel-list" id="channelList">
        <div style="text-align: center; color: #777; padding: 20px;">சேனல்கள் ஏற்றப்படுகின்றன...</div>
    </div>

    <div class="footer">Powered by IPTV-ORG</div>

    <script>
        const m3uUrl = 'https://iptv-org.github.io/iptv/index.m3u';
        
        async function loadChannels() {
            try {
                // CORS சிக்கலைத் தவிர்க்க பப்ளிக் ப்ராக்ஸி அல்லது நேரடியாக fetch செய்யப்படுகிறது
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(m3uUrl);
                const response = await fetch(proxyUrl);
                const data = await response.text();
                parseM3U(data);
            } catch (error) {
                console.error("Error loading M3U:", error);
                document.getElementById('channelList').innerHTML = '<div style="color:red; text-align:center;">சேனல் பட்டியலை ஏற்றுவதில் பிழை.</div>';
            }
        }

        function parseM3U(data) {
            const lines = data.split('\\n');
            const channels = [];
            let currentChannel = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const nameParts = line.split(',');
                    currentChannel = {
                        name: nameParts[nameParts.length - 1] || 'Unknown Channel',
                        logo: logoMatch ? logoMatch[1] : 'https://via.placeholder.com/48',
                        url: ''
                    };
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name && currentChannel.url) {
                        channels.push(currentChannel);
                    }
                    currentChannel = {};
                }
            }

            renderChannels(channels);
        }

        function renderChannels(channels) {
            const listEl = document.getElementById('channelList');
            listEl.innerHTML = '';

            if (channels.length === 0) {
                listEl.innerHTML = '<div style="text-align:center; color:#777;">சேனல்கள் எதுவும் கிடைக்கவில்லை</div>';
                return;
            }

            // முதல் 100 சேனல்களை மட்டும் காண்பிக்கிறோம் (வேகமாக இயங்க)
            channels.slice(0, 100).forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.innerHTML = `
                    <img class="channel-logo" src="${ch.logo}" alt="" onerror="this.src='https://via.placeholder.com/48'">
                    <div class="channel-info">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-playing">Live Stream</div>
                    </div>
                `;
                item.onclick = () => playChannel(ch);
                listEl.appendChild(item);

                // முதல் சேனலை தானாக பிளே செய்ய வைக்க
                if (index === 0) {
                    playChannel(ch);
                }
            });
        }

        function playChannel(ch) {
            const video = document.getElementById('videoPlayer');
            document.getElementById('currentShowTitle').innerText = ch.name;
            document.getElementById('currentShowTime').innerText = "Live Broadcast • " + ch.url;

            if (Hls.isSupported() && ch.url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(e => console.log("Auto-play blocked:", e));
                });
            } else {
                video.src = ch.url;
                video.play().catch(e => console.log("Playback error:", e));
            }
        }

        loadChannels();
    </script>
</body>
</html>
