<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muthumani Music Video</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px;
        }
        .video-container {
            position: relative;
            width: 80%;
            max-width: 800px;
            margin: auto;
            padding-bottom: 45%; /* 16:9 Aspect Ratio */
            height: 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
        h2 {
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Muthumani Music Video - DOROTHY | Maestro Ilaiyaraaja | Karthik Subbaraj</h2>

    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/rs0gQ-3hbPQ" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
        </iframe>
    </div>

</body>
</html>
