<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Online Data Entry Portal</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2, h3 {
            text-align: center;
            color: #333;
        }
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .nav-btn {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .nav-btn.active {
            background-color: #24292e;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        .cancel-btn {
            background-color: #6c757d;
        }
        .filter-section {
            margin-bottom: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #24292e;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .edit-btn {
            background-color: #ffc107;
            color: black;
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        #loading {
            text-align: center;
            color: #24292e;
            font-weight: bold;
            display: none;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GitHub Online Data Entry Portal</h2>
    
    <div class="nav-buttons">
        <button type="button" class="nav-btn active" id="navEntry" onclick="switchPage('entry')">டேட்டா பதிவு செய் (Data Entry)</button>
        <button type="button" class="nav-btn" id="navView" onclick="switchPage('view')">டேட்டாவைப் பார் (View Entries)</button>
    </div>

    <div id="loading">GitHub-உடன் இணைக்கிறது, காத்திருக்கவும்...</div>

    <!-- Page 1: Form -->
    <div id="entryPage" class="page active">
        <form id="dataForm">
            <input type="hidden" id="editIndex" value="">
            
            <div class="form-group">
                <label for="entryDate">தேதி (Date):</label>
                <input type="date" id="entryDate" required>
            </div>

            <div class="form-group">
                <label for="name">பெயர் (Name):</label>
                <input type="text" id="name" required placeholder="பெயரை உள்ளிடவும்">
            </div>
            
            <div class="form-group">
                <label for="morning">காலை (Morning - Number):</label>
                <input type="number" id="morning" required placeholder="எண் மதிப்பை உள்ளிடவும்">
            </div>
            
            <div class="form-group">
                <label for="afternoon">மதியம் (Afternoon - Number):</label>
                <input type="number" id="afternoon" required placeholder="எண் மதிப்பை உள்ளிடவும்">
            </div>
            
            <div class="form-group">
                <label for="evening">மாலை (Evening - Number):</label>
                <input type="number" id="evening" required placeholder="எண் மதிப்பை உள்ளிடவும்">
            </div>
            
            <div class="btn-group">
                <button type="submit" id="saveButton">பதிவு செய் (Save Entry)</button>
                <button type="button" id="cancelButton" class="cancel-btn" style="display:none;" onclick="resetForm()">ரத்து செய் (Cancel)</button>
            </div>
        </form>
    </div>

    <!-- Page 2: View -->
    <div id="viewPage" class="page">
        <div class="filter-section">
            <div style="flex-grow: 1;">
                <label for="filterDate">தேதி வாரியாக பார்க்க (Filter by Date):</label>
                <input type="date" id="filterDate">
            </div>
            <div>
                <button type="button" onclick="filterData()" style="padding: 10px 20px;">தேடு (Search)</button>
            </div>
            <div>
                <button type="button" onclick="fetchDataFromGitHub()" style="padding: 10px 20px; background-color: #6c757d;">அனைத்தையும் காட்டு (Reset)</button>
            </div>
        </div>

        <h3>GitHub-ல் சேமிக்கப்பட்ட விவரங்கள்</h3>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>தேதி & நேரம்</th>
                    <th>பெயர்</th>
                    <th>காலை</th>
                    <th>மதியம்</th>
                    <th>மாலை</th>
                    <th>மொத்தம் (Total)</th>
                    <th>செயல்பாடுகள்</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7">தகவல்கள் ஏற்றப்படுகின்றன...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- GitHub அமைப்புகள் ---
    const GITHUB_USERNAME = 'YOUR_GITHUB_USERNAME'; // உங்கள் GitHub Username-ஐ இங்கே தரவும்
    const REPO_NAME = 'YOUR_REPO_NAME';             // உங்கள் Repository பெயரைக் கொடுக்கவும்
    const FILE_PATH = 'data.json';                  // டேட்டா சேமிக்கப்படும் கோப்பின் பெயர்
    const GITHUB_TOKEN = 'YOUR_GITHUB_TOKEN';       // உங்கள் GitHub Personal Access Token-ஐ இங்கே தரவும்

    const apiURL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

    let allData = [];
    let fileSha = ""; // GitHub-ல் ஃபைலை update செய்ய இந்த SHA தேவைப்படும்

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('entryDate').valueAsDate = new Date();
        fetchDataFromGitHub();
    });

    function switchPage(pageName) {
        document.getElementById('entryPage').classList.remove('active');
        document.getElementById('viewPage').classList.remove('active');
        document.getElementById('navEntry').classList.remove('active');
        document.getElementById('navView').classList.remove('active');

        if (pageName === 'entry') {
            document.getElementById('entryPage').classList.add('active');
            document.getElementById('navEntry').classList.add('active');
        } else {
            document.getElementById('viewPage').classList.add('active');
            document.getElementById('navView').classList.add('active');
            fetchDataFromGitHub();
        }
    }

    const form = document.getElementById('dataForm');
    const tableBody = document.getElementById('tableBody');
    const loading = document.getElementById('loading');

    // GitHub-ல் இருந்து டேட்டாவைப் பெறுதல் (Fetch)
    function fetchDataFromGitHub() {
        loading.style.display = "block";
        fetch(apiURL, {
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Accept': 'application/vnd.github.v3+json'
            }
        })
        .then(response => {
            if (response.status === 404) {
                // ஒருவேளை data.json கோப்பு இல்லை எனاில் காலியாக வைத்துக்கொள்ளும்
                return { content: btoa(JSON.stringify([])), sha: "" };
            }
            return response.json();
        })
        .then(data => {
            loading.style.display = "none";
            if (data.content) {
                fileSha = data.sha;
                const decodedJson = JSON.parse(atob(data.content));
                allData = Array.isArray(decodedJson) ? decodedJson : [];
            } else {
                allData = [];
            }
            renderTable(allData);
        })
        .catch(error => {
            loading.style.display = "none";
            console.error('Error fetching data:', error);
            tableBody.innerHTML = `<tr><td colspan="7" style="color: red;">டேட்டாவைப் பெற முடியவில்லை. அமைப்புகளைச் சரிபார்க்கவும்.</td></tr>`;
        });
    }

    // GitHub-க்கு டேட்டாவை அனுப்புவது / சேமிப்பது (Save/Update)
    function saveDatatoGitHub(updatedData, successMessage) {
        loading.style.display = "block";
        const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(updatedData, null, 2))));

        const bodyData = {
            message: "Update data.json via Web Portal",
            content: contentEncoded,
            sha: fileSha
        };

        fetch(apiURL, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'Accept': 'application/vnd.github.v3+json'
            },
            body: JSON.stringify(bodyData)
        })
        .then(response => response.json())
        .then(data => {
            loading.style.display = "none";
            if (data.content) {
                fileSha = data.content.sha;
                alert(successMessage);
                resetForm();
                switchPage('view');
            } else {
                alert("சேமிப்பதில் பிழை ஏற்பட்டது.");
            }
        })
        .catch(error => {
            loading.style.display = "none";
            console.error('Error saving data:', error);
            alert("இணைய இணைப்பைச் சரிபார்க்கவும்.");
        });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const editIndex = document.getElementById('editIndex').value;
        const entryDate = document.getElementById('entryDate').value;
        const name = document.getElementById('name').value;
        const morning = parseFloat(document.getElementById('morning').value) || 0;
        const afternoon = parseFloat(document.getElementById('afternoon').value) || 0;
        const evening = parseFloat(document.getElementById('evening').value) || 0;
        const total = morning + afternoon + evening;

        const currentTime = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        const dateTimeStr = `${entryDate} (${currentTime})`;

        if (editIndex === "") {
            const entryData = { dateTimeStr, name, morning, afternoon, evening, total };
            allData.push(entryData);
        } else {
            allData[editIndex].dateTimeStr = `${entryDate} (Edited)`;
            allData[editIndex].name = name;
            allData[editIndex].morning = morning;
            allData[editIndex].afternoon = afternoon;
            allData[editIndex].evening = evening;
            allData[editIndex].total = total;
        }

        saveDatatoGitHub(allData, "வெற்றிகரமாக GitHub-ல் சேமிக்கப்பட்டது!");
    });

    function renderTable(dataToShow) {
        tableBody.innerHTML = "";

        if (dataToShow.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="7" style="color: #777;">தகவல்கள் எதுவும் இல்லை</td></tr>`;
            return;
        }

        dataToShow.forEach((data, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${data.dateTimeStr || ''}</td>
                <td>${data.name}</td>
                <td>${data.morning}</td>
                <td>${data.afternoon}</td>
                <td>${data.evening}</td>
                <td><strong>${data.total}</strong></td>
                <td>
                    <button class="edit-btn" onclick="editEntry(${index})">Edit</button>
                    <button class="delete-btn" onclick="deleteEntry(${index})">Delete</button>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    function editEntry(index) {
        const data = allData[index];
        document.getElementById('editIndex').value = index;
        if(data.dateTimeStr) {
            const datePart = data.dateTimeStr.split(' ')[0];
            document.getElementById('entryDate').value = datePart;
        }
        document.getElementById('name').value = data.name;
        document.getElementById('morning').value = data.morning;
        document.getElementById('afternoon').value = data.afternoon;
        document.getElementById('evening').value = data.evening;

        document.getElementById('saveButton').innerText = "புதுப்பி (Update Entry)";
        document.getElementById('cancelButton').style.display = "block";
        switchPage('entry');
    }

    function resetForm() {
        form.reset();
        document.getElementById('editIndex').value = "";
        document.getElementById('entryDate').valueAsDate = new Date();
        document.getElementById('saveButton').innerText = "பதிவு செய் (Save Entry)";
        document.getElementById('cancelButton').style.display = "none";
    }

    function filterData() {
        const filterDate = document.getElementById('filterDate').value;
        if (!filterDate) {
            alert("தயவுசெய்து தேதியைத் தேர்ந்தெடுக்கவும்!");
            return;
        }
        const filtered = allData.filter(item => item.dateTimeStr && item.dateTimeStr.startsWith(filterDate));
        renderTable(filtered);
    }

    function deleteEntry(index) {
        if (confirm("நிச்சயமாக இந்த பதிவை GitHub-ல் இருந்து நீக்க விரும்புகிறீர்களா?")) {
            allData.splice(index, 1);
            saveDatatoGitHub(allData, "வெற்றிகரமாக நீக்கப்பட்டு GitHub புதுப்பிக்கப்பட்டது!");
        }
    }
</script>

</body>
</html>
