<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Actions Data Entry Portal</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2, h3 {
            text-align: center;
            color: #333;
        }
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .nav-btn {
            background-color: #6c757d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .nav-btn.active {
            background-color: #24292e;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .cancel-btn {
            background-color: #6c757d;
        }
        .filter-section {
            margin-bottom: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #24292e;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .edit-btn {
            background-color: #ffc107;
            color: black;
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        #loading {
            text-align: center;
            color: #24292e;
            font-weight: bold;
            display: none;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Secure Data Entry Portal</h2>
    
    <div class="nav-buttons">
        <button type="button" class="nav-btn active" id="navEntry" onclick="switchPage('entry')">டேட்டா பதிவு செய்</button>
        <button type="button" class="nav-btn" id="navView" onclick="switchPage('view')">டேட்டாவைப் பார்</button>
    </div>

    <div id="loading">தரவுகள் ஏற்றப்படுகின்றன...</div>

    <!-- Page 1: Form -->
    <div id="entryPage" class="page active">
        <form id="dataForm">
            <input type="hidden" id="editIndex" value="">
            
            <div class="form-group">
                <label for="entryDate">தேதி (Date):</label>
                <input type="date" id="entryDate" required>
            </div>

            <div class="form-group">
                <label for="name">பெயர் (Name):</label>
                <input type="text" id="name" required placeholder="பெயரை உள்ளிடவும்">
            </div>
            
            <div class="form-group">
                <label for="morning">காலை (Morning):</label>
                <input type="number" id="morning" required placeholder="எண் மதிப்பை உள்ளிடவும்">
            </div>
            
            <div class="form-group">
                <label for="afternoon">மதியம் (Afternoon):</label>
                <input type="number" id="afternoon" required placeholder="எண் மதிப்பை உள்ளிடவும்">
            </div>
            
            <div class="form-group">
                <label for="evening">மாலை (Evening):</label>
                <input type="number" id="evening" required placeholder="எண் மதிப்பை உள்ளிடவும்">
            </div>
            
            <div class="btn-group">
                <button type="submit" id="saveButton">பதிவு செய் (Save Entry)</button>
                <button type="button" id="cancelButton" class="cancel-btn" style="display:none;" onclick="resetForm()">ரத்து செய்</button>
            </div>
        </form>
    </div>

    <!-- Page 2: View -->
    <div id="viewPage" class="page">
        <div class="filter-section">
            <div style="flex-grow: 1;">
                <label for="filterDate">தேதி வாரியாக பார்க்க:</label>
                <input type="date" id="filterDate">
            </div>
            <div>
                <button type="button" onclick="filterData()" style="padding: 10px 20px;">தேடு</button>
            </div>
            <div>
                <button type="button" onclick="fetchData()" style="padding: 10px 20px; background-color: #6c757d;">அனைத்தையும் காட்டு</button>
            </div>
        </div>

        <h3>சேமிக்கப்பட்ட விவரங்கள்</h3>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>தேதி & நேரம்</th>
                    <th>பெயர்</th>
                    <th>காலை</th>
                    <th>மதியம்</th>
                    <th>மாலை</th>
                    <th>மொத்தம் (Total)</th>
                    <th>செயல்பாடுகள்</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7">தகவல்கள் ஏற்றப்படுகின்றன...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // உங்கள் GitHub Pages முகவரியில் உள்ள data.json கோப்பின் பாதை
    const dataFileURL = 'data.json?t=' + new Date().getTime(); // Cache வராமல் இருக்க
    let allData = [];

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('entryDate').valueAsDate = new Date();
        fetchData();
    });

    function switchPage(pageName) {
        document.getElementById('entryPage').classList.remove('active');
        document.getElementById('viewPage').classList.remove('active');
        document.getElementById('navEntry').classList.remove('active');
        document.getElementById('navView').classList.remove('active');

        if (pageName === 'entry') {
            document.getElementById('entryPage').classList.add('active');
            document.getElementById('navEntry').classList.add('active');
        } else {
            document.getElementById('viewPage').classList.add('active');
            document.getElementById('navView').classList.add('active');
            fetchData();
        }
    }

    const form = document.getElementById('dataForm');
    const tableBody = document.getElementById('tableBody');
    const loading = document.getElementById('loading');

    function fetchData() {
        loading.style.display = "block";
        fetch('data.json?' + new Date().getTime())
        .then(response => {
            if (!response.ok) return [];
            return response.json();
        })
        .then(data => {
            loading.style.display = "none";
            allData = Array.isArray(data) ? data : [];
            renderTable(allData);
        })
        .catch(error => {
            loading.style.display = "none";
            allData = [];
            renderTable(allData);
        });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        alert("GitHub-ல் நேரடியாக பிரவுசர் மூலம் கோப்புகளை உடனுக்குடன் மாற்றுவதற்கு GitHub API அல்லது Server தேவையாகும். GitHub Actions மூலமாக கோப்பை மாற்ற GitHub Commit செய்ய வேண்டும்.\n\nமிக எளிமையான ஆன்லைன் முறைக்கு 'Google Sheets & Apps Script' பயன்படுத்துவதே சிறந்த வழியாகும்.");
    });

    function renderTable(dataToShow) {
        tableBody.innerHTML = "";
        if (dataToShow.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="7" style="color: #777;">தகவல்கள் எதுவும் இல்லை</td></tr>`;
            return;
        }
        dataToShow.forEach((data, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${data.dateTimeStr || ''}</td>
                <td>${data.name}</td>
                <td>${data.morning}</td>
                <td>${data.afternoon}</td>
                <td>${data.evening}</td>
                <td><strong>${data.total}</strong></td>
                <td>-</td>
            `;
            tableBody.appendChild(row);
        });
    }
</script>

</body>
</html>
